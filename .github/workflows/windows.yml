name: Windows verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - name: Check documentation links
        run: .\tools\Test-Documentation.ps1
      - name: Build and verify offline regressions and demo UI
        run: .\tools\Test-App.ps1
      - name: Build assembly inspection utility
        run: dotnet build tools/AssemblyInspector -c Release --configfile tools/AssemblyInspector/NuGet.Config --nologo -v quiet
      - name: Verify portable packaging
        run: .\tools\Package-App.ps1 -SkipBuild
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-verification
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/tests.json
            artifacts/tests.xml
            artifacts/gsx-initialization-checks.json
            artifacts/app-preview.png
            artifacts/app-preview.png.json
            dist/startup-error.txt
